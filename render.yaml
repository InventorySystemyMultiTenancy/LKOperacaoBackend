services:
  # Backend API
  - type: web
    name: lk-operacao-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lk-operacao-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@lkoperacao.com
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: lk-operacao-db
    plan: free
    databaseName: lkoperacao
    user: lkoperacao
